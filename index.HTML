<!DOCTYPE html>
<html>
<head>
    <style>

        img {
            text-align: center;

            size: 500px;

        }

        .topnav {
            background-color: #333;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .topnav a {
            float: left;
            color: #ddd;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }
        
        .topnav a.active {
            background-color: #aa0404;
            color: white;
        }
        
        .topnav input[type=text] {
            float: left;
            width: 300px;
            padding: 7px;
            margin-top: 6px;
            margin-right: 16px;
            font-size: 17px;
        }

        button {
            padding: 10px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            cursor: pointer;
        }
    </style>
</head>
<body>
<a href="index.HTML">
    
    <img src="images/PJ_Logo.png" alt="PJ Logo" width="100">

</a>

    <button type="button">Filter</button>

    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#Most Selling">Most Selling</a>
        <a href="#Placeholder">Placeholder</a>
        <a href="#Privacy">Privacy</a>
        <input type="text" placeholder="Search..">
    </div>



</body>
</html>
