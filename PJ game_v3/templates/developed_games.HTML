<!DOCTYPE html>
<html>
<head>


    <style>
        body {
            position: relative;
            margin: 0;
        }
        

        img {
            text-align: center;
            
            size: 500px;

        }

        /* This customizes the design of the top navigation bar to make it different sizes and colors*/
        .topnav {
            background-color: #333;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .topnav a {
            float: left;
            color: #ddd;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }
        
        .topnav a.active {
            background-color: #aa0404;
            color: white;
        }
        
        .topnav input[type=text] {
            float: left;
            width: 300px;
            padding: 7px;
            margin-top: 6px;
            margin-right: 16px;
            font-size: 17px;
        }

        .filter button {
            width: 75px;
            height: 35px;
            margin-top: 50px;
            margin-left: 100px;
            padding: 10px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
        }

        .filter button:hover {
            background-color: grey;
        
        }

        /*This makes sure that the Logo image stays directly in the center of the screen */
        .logo-image {
            display: flex;
            align-items: center;     
            justify-content: center; 
            gap: 0px;               
            margin-bottom: 20px;
        }

        .logo-image h1{
            font-size: 100px;
        }

        /*This makes sure that the side decorations stay on the sides*/
        .left-side-img, .right-side-img{
            position: absolute;
            z-index: -1;

            width: 75px;
            top: 0;
            bottom: 0;
            background-image: url('/static/images/sides.png');
            background-repeat: repeat-y;

        }

        .left-side-img {
            left: 0;
        }

        .right-side-img {
            right: 0;
        }

        .side-images {
            margin-left: 10px;  
            display: flex;
        }

        .data-box {
            background-color: #d3d3d3;
            width: 1300px;
            max-width: 1300px;
            margin: 40px auto;
            height: 1500px;
            border-radius: 8px;
        }
    </style>

</head>
<body>

    <div class="right-side-img"></div>
    <div class="left-side-img"></div>


    <div class="logo-image">
        <a href="index.HTML">
            <img src="/static/images/PJ_Logo.png" alt="PJ Logo" width="400">
        </a>
        <h1>VGI</h1>
    </div>

    <!--This class creates the baseline for the top navigation bar-->
    <div class="topnav">
        <a href="index.HTML">Home</a>
        <a href="most_selling.HTML">Most Selling</a>
        <a href="game_genres.HTML">Game Genres</a>
        <a class= "active" href="developed_games.HTML">Developed Games</a>
        <a href="published_games.HTML">Published Games</a>
        <a href="about.HTML">About</a>
        <input type="text" placeholder="Search..">
    </div>


    <div class="filter">
    <button type="button">Filter</button>

    </div>




    <div class="data-box">
        </div>



</body>
</html>
