<!DOCTYPE html>
<html>
<head>


    <style>

        body {
            position: relative;
            margin: 0;
        }
        
        /*This is here so the image stays in the center of the screen */
        img {
            text-align: center;
            
            size: 500px;

        }

        /* This customizes the design of the top navigation bar to make it different sizes and colors*/
        .topnav {
            background-color: #333;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .topnav a {
            float: left;
            color: #ddd;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }
        
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }
        
        .topnav a.active {
            background-color: #aa0404;
            color: white;
        }
        
        /* the top navagation search bar  */
        .topnav input[type=text] {
            float: left;
            width: 300px; /* This is the total width of the nav bar as a whole */
            padding: 7px;
            margin-top: 6px;
            margin-right: 16px;
            font-size: 17px;
        }

        /* This customizes how the filter button would look */
        .filter button {
            width: 75px;
            height: 35px;
            margin-top: 50px;
            margin-left: 100px;
            padding: 10px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer; /* This makes the button look clickable when hovering with the cursor */
        }

        /* This changes the color of the filer button upon hovering with a cursor */
        .filter button:hover {
            background-color: grey;
        
        }

        /* This makes sure that the Logo image stays directly in the center of the screen */
        .logo-image {
            display: flex; /* Forms a flexbox layout system */
            align-items: center;     
            justify-content: center; 
            gap: 0px;               
            margin-bottom: 20px;
        }

        .logo-image h1{
            font-size: 100px;
        }

        /*This makes sure that the side decorations stay on the sides*/
        .left-side-img, .right-side-img{
            position: absolute;
            z-index: -1;

            width: 75px;
            top: 0;
            bottom: 0;
            background-image: url('/static/images/sides.png'); /* the link to the images */
            background-repeat: repeat-y;

        }

        .left-side-img {
            left: 0; /* makes sure the decoration is stuck on the left */
        }

        .right-side-img {
            right: 0; /* makes sure the decoration is stuck on the right */
        }

        .side-images {
            margin-left: 10px;  
            display: flex;
        }

        .data-box {
            background-color: #d3d3d3;
            width: 1300px;
            max-width: 1300px;
            margin: 40px auto;
            height: auto; /* allows the grey box to follow the amount content inside */
            min-height: 500px; /* Creates the minimal height */
            border-radius: 8px;
            padding-bottom: 40px; /* Adds space on the bottom of the webpage */
        }
    </style>

</head>
<body>

    

    <div class="right-side-img"></div>
    <div class="left-side-img"></div>

    <!--This class loads the main Logo image into the system-->
    <div class="logo-image">
        <a href="index.HTML">
            <img src="/static/images/PJ_Logo.png" alt="PJ Logo" width="400"> <!--This is the directory of the logo-->
        </a>
        <h1>VGI</h1>
    </div>

    <!--This class creates the baseline for the top navigation bar-->
    <div class="topnav">
        <a class="active" href="index.HTML">Home</a>
        <a href="most_selling.HTML">Most Selling</a>
        <a href="game_genres.HTML">Game Genres</a>
        <a href="developed_games.HTML">Developed Games</a>
        <a href="published_games.HTML">Published Games</a>
        <a href="about.HTML">About</a>
        <input type="text" placeholder="Search..">
    </div>

    <!--This class creates the filter button and makes it interactable-->
    <div class="filter">
    <button type="button">Filter</button>

    </div>



    <!--This class creates the dark grey box that the data will rest on-->
<div class="data-box">
        <table style="width: 100%; text-align: left; padding: 20px;">
            <tr>
                <th>Gameid</th>
                <th>Game Title</th>
                <th>Sales (Millions)</th>
                <th>Series</th>
                <th>Developer</th>
                <th>Publisher</th>
            </tr>
            
            {% for game in games %}
            <tr>
                <!-- These keys match the exact column names in Games_tbl -->
                <td>{{ game['Gameid']}}</td>
                <td>{{ game['Game'] }}</td>
                <td>{{ game['Sales'] }}</td>
                <td>{{ game['Series'] }}</td>
                <td>{{ game['Developer'] }}</td>
                <td>{{ game['Publisher'] }}</td>
            </tr>
            {% endfor %}
            
        </table>
    </div>



</body>
</html>
